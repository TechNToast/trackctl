name: Terraform CI

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform-ci.yml

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Branches in this repo only: fork PRs get no Azure sign-in.
  plan-dev:
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_log_analytics_workspace_id: ${{ vars.LOG_WORKSPACE_ID }}
      TF_VAR_operators_group_id: ${{ vars.OPERATORS_GROUP_ID }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="key=dev.tfstate"

      - name: Terraform plan
        run: |
          terraform plan -lock=false -input=false -no-color -var-file=envs/dev/dev.tfvars 2>&1 | tee plan.txt
          exit "${PIPESTATUS[0]}"

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/terraform/plan.txt';
            if (!fs.existsSync(path)) { return; }
            const raw = fs.readFileSync(path, 'utf8');
            const plan = raw.length > 60000 ? raw.slice(0, 60000) + '\n\n...truncated...' : raw;
            const header = '<!-- terraform-plan-dev -->';
            const body = `${header}\n## Terraform plan (dev)\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(header));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

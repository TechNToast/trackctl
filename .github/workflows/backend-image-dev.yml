name: Backend Deploy (Dev)

# Build once, tag with the commit, run migrations with that image, then switch the API to it.
# Signs in with the dev deploy identity (OIDC); no registry or database passwords exist.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-image-dev.yml

concurrency:
  group: backend-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-athena-dev
      IMAGE_NAME: athena-backend

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find resources
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          {
            echo "ACR=$(az acr list -g "$RESOURCE_GROUP" --query '[0].name' -o tsv)"
            echo "APP=$(az containerapp list -g "$RESOURCE_GROUP" --query '[0].name' -o tsv)"
            echo "MIGRATE_JOB=$(az containerapp job list -g "$RESOURCE_GROUP" --query "[?ends_with(name, '-migrate')].name | [0]" -o tsv)"
            echo "INGEST_JOB=$(az containerapp job list -g "$RESOURCE_GROUP" --query "[?ends_with(name, '-ingest')].name | [0]" -o tsv)"
          } >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          IMAGE="${ACR}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::12}"
          az acr login --name "$ACR"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run migrations
        if: env.MIGRATE_JOB != ''
        run: |
          az containerapp job update -n "$MIGRATE_JOB" -g "$RESOURCE_GROUP" --image "$IMAGE" --only-show-errors -o none
          EXECUTION=$(az containerapp job start -n "$MIGRATE_JOB" -g "$RESOURCE_GROUP" --query name -o tsv)
          for _ in $(seq 1 60); do
            STATUS=$(az containerapp job execution show -n "$MIGRATE_JOB" -g "$RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION" --query properties.status -o tsv)
            echo "Migration: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "Logs: Log Analytics, ContainerAppConsoleLogs_CL where ContainerJobName_s == '$MIGRATE_JOB'"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for migrations."; exit 1

      - name: Deploy API and ingest job
        run: |
          az containerapp update -n "$APP" -g "$RESOURCE_GROUP" --image "$IMAGE" --only-show-errors -o none
          if [ -n "$INGEST_JOB" ]; then
            az containerapp job update -n "$INGEST_JOB" -g "$RESOURCE_GROUP" --image "$IMAGE" --only-show-errors -o none
          fi

      - name: Health check
        run: |
          FQDN=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in $(seq 1 12); do
            if curl -fsS "https://${FQDN}/health"; then
              echo; echo "Deployed $IMAGE to https://${FQDN}" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "Health check attempt ${attempt} failed; retrying..."
            sleep 10
          done
          exit 1

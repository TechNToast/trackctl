name: Terraform Apply

# Prod: the "prod" GitHub environment requires approval and only runs from main
# (managed in techntoast-platform). Add prod here once envs/prod/prod.tfvars exists.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_log_analytics_workspace_id: ${{ vars.LOG_WORKSPACE_ID }}
      TF_VAR_operators_group_id: ${{ vars.OPERATORS_GROUP_ID }}
      TARGET_ENV: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="key=${TARGET_ENV}.tfstate"

      - name: Terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan -var-file="envs/${TARGET_ENV}/${TARGET_ENV}.tfvars" | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            grep -E '^\s+# |^Plan:|^No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: terraform apply -input=false -lock-timeout=60s tfplan

      - name: Outputs
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
